          <path fill="#621360" d="M49.8,24.9L49.8,24.9H24.9v49.8v24.9l24.9-24.9c13.8,0,24.9-11.2,24.9-24.9C74.8,36.1,63.6,24.9,49.8,24.9z"/>
          <polygon fill="#0076A6" points="49.8,0 49.8,24.9 24.9,24.9"/>
          <rect x="24.9" y="24.9" fill="#3C0238" width="24.9" height="49.8"/>
        </svg>

      <div>
        <div class="sidebar-brand-name">UTM Builder</div>

    <nav class="sidebar-nav" aria-label="Primary">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>

      <a href="shared.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="10" x2="9" y2="20"/></svg>

      <a href="admin.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>

      <a href="account.html" aria-current="page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>

      <a href="#" id="logout-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

    <div class="sidebar-footer">
      <a class="sidebar-contact" href="https://teams.microsoft.com/l/chat/0/0?users=ben.hunt@port.ac.uk" target="_blank" rel="noopener">
        <div class="avatar">BH</div>
        <div>
          <div class="sidebar-contact-name">Ben Hunt</div>
          <div class="sidebar-contact-hint">Questions? Reach out</div>
        </div>
      </a>
    </div>
  </div>

  <main id="main" class="main">
    <div class="page-head">
      <div>
        <h1>My account</h1>
        <p class="intro">Signed in as <strong id="account-username"></strong>.</p>
      </div>
    </div>

    <section class="card" aria-labelledby="change-password-heading" style="max-width: 420px; display: flex; flex-direction: column; gap: 16px;">
      <div>
        <div class="card-label" id="change-password-heading">Change password</div>
        <p class="hint" style="margin-top: 6px;">Only you can do this for your own account — an admin resets it for you if you're locked out.</p>
      </div>
      <form id="change-password-form" novalidate>
        <div class="field">
          <label for="current-password">Current password</label>
          <input type="password" id="current-password" name="current-password" autocomplete="current-password" required />
        </div>
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" name="new-password" autocomplete="new-password" placeholder="At least 8 characters" required />
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required />
        </div>
        <ul class="field-errors" id="change-password-errors" aria-live="polite"></ul>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Update password</button>
        </div>
      </form>
      <p id="change-password-success" class="success-banner" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        Password updated.
      </p>
    </section>
  </main>
</div>

<script type="module" src="js/account.js"></script>

<script type="module" src="js/logout.js"></script>
</body>
</html>
