<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Shared view — UTM Builder — University of Portsmouth</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png" />

<link rel="shortcut icon" href="favicon/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="app-shell">
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="logo-mark">
        <svg viewBox="0 0 74.8 74.8" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#009EE2" d="M0,49.8c0,13.8,11.2,24.9,24.9,24.9h24.9V0H0V49.8z"/>
          <path fill="#621360" d="M49.8,24.9L49.8,24.9H24.9v49.8v24.9l24.9-24.9c13.8,0,24.9-11.2,24.9-24.9C74.8,36.1,63.6,24.9,49.8,24.9z"/>
          <polygon fill="#0076A6" points="49.8,0 49.8,24.9 24.9,24.9"/>
          <rect x="24.9" y="24.9" fill="#3C0238" width="24.9" height="49.8"/>
        </svg>
      </div>
      <div>
        <div class="sidebar-brand-name">UTM Builder</div>
        <div class="sidebar-brand-sub">RECRUITMENT MARKETING</div>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Primary">
      <a href="index.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
        Builder
      </a>
      <a href="shared.html" aria-current="page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="10" x2="9" y2="20"/></svg>
        Shared view
      </a>
      <a href="admin.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/></svg>
        Admin
      </a>
      <a href="#" id="logout-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-contact">
        <div class="avatar">BH</div>
        <div>
          <div class="sidebar-contact-name">Ben Hunt</div>
          <div class="sidebar-contact-hint">Questions? Reach out</div>
        </div>
      </div>
    </div>
  </div>

  <main id="main" class="main">
    <div class="page-head">
      <div>
        <h1>Shared view</h1>
        <p class="intro">Search or filter to check what's already live before you build something new.</p>
      </div>
    </div>

    <form id="filter-form" class="card filter-form" novalidate>
      <div class="card-label">Filters</div>
      <div class="filter-row">
        <div class="field field-search">
          <label for="search">Search</label>
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B7AFC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="search" name="search" placeholder="Search across all fields…" />
        </div>
        <div class="field">
          <label for="filter-setUpBy">Set Up By</label>
          <input type="text" id="filter-setUpBy" name="filter-setUpBy" />
        </div>
        <div class="field">
          <label for="filter-date">Date</label>
          <input type="date" id="filter-date" name="filter-date" />
        </div>
      </div>
      <div class="filter-row">
        <div class="field">
          <label for="filter-pageUrl">Page URL</label>
          <input type="text" id="filter-pageUrl" name="filter-pageUrl" />
        </div>
        <div class="field">
          <label for="filter-campaign">Campaign</label>
          <input type="text" id="filter-campaign" name="filter-campaign" />
        </div>
        <div class="field">
          <label for="filter-gaMedium">GA4 Medium</label>
          <select id="filter-gaMedium" name="filter-gaMedium">
            <option value="">All</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-campaignTerm">Campaign Term</label>
          <select id="filter-campaignTerm" name="filter-campaignTerm">
            <option value="">All</option>
          </select>
        </div>
        <div class="field">
          <label for="filter-source">Source</label>
          <input type="text" id="filter-source" name="filter-source" />
        </div>
        <div class="field">
          <label for="filter-campaignContent">Campaign Content</label>
          <input type="text" id="filter-campaignContent" name="filter-campaignContent" />
        </div>
      </div>
    </form>

    <div class="filters-bar">
      <div class="active-filters" id="active-filters" aria-live="polite"></div>
      <div class="filters-summary">
        <span class="filters-count" id="shared-summary"></span>
        <button type="button" class="btn btn-secondary" id="clear-filters-btn">Clear filters</button>
        <button type="button" class="btn btn-secondary" id="export-shared-csv-btn">Export CSV</button>
      </div>
    </div>

    <p id="shared-status-region" class="visually-hidden" role="status" aria-live="polite"></p>

    <div class="card" style="padding: 0">
      <div id="shared-table-container"></div>
    </div>
  </main>
</div>

<script type="module" src="js/shared-app.js"></script>
<script type="module" src="js/logout.js"></script>
</body>
</html>
