<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>Sign in — UTM Builder — University of Portsmouth</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png" />
<link rel="shortcut icon" href="favicon/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Encode+Sans+Expanded:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body style="background: var(--bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;">
<main id="main" style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 24px;">
  <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
    <div style="width: 36px; height: 36px; border-radius: 10px; background: #ffffff; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex: 0 0 36px">
      <svg viewBox="0 0 74.8 74.8" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
        <path fill="#009EE2" d="M0,49.8c0,13.8,11.2,24.9,24.9,24.9h24.9V0H0V49.8z"/>
        <path fill="#621360" d="M49.8,24.9L49.8,24.9H24.9v49.8v24.9l24.9-24.9c13.8,0,24.9-11.2,24.9-24.9C74.8,36.1,63.6,24.9,49.8,24.9z"/>
        <polygon fill="#0076A6" points="49.8,0 49.8,24.9 24.9,24.9"/>
        <rect x="24.9" y="24.9" fill="#3C0238" width="24.9" height="49.8"/>
      </svg>
    </div>
    <div style="font-family: 'Encode Sans Expanded', sans-serif; font-weight: 700; font-size: 16px; color: var(--purple-dark)">UTM Builder</div>
  </div>

  <div class="card" style="display: flex; flex-direction: column; gap: 4px;">
    <h1 style="font-size: 20px;">Sign in</h1>
    <p class="hint" style="margin-bottom: 14px;">Ask an admin if you don't have an account yet.</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <ul class="field-errors" id="login-errors" aria-live="polite"></ul>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">Sign in</button>
    </form>
  </div>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>
